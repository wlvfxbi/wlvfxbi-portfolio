  function showView(name){
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    const el = document.getElementById('view-' + name);
    if (el) el.classList.add('active');
  }

  function handleRoute(){
    let hash = window.location.hash.replace('#', '') || 'inicio';
    if (hash === 'contacto'){
      showView('sobremi');
      window.scrollTo({top: 0, behavior: 'instant'});
      setTimeout(() => {
        document.getElementById('contacto-block')?.scrollIntoView({behavior: 'smooth', block: 'start'});
      }, 120);
      return;
    }
    if (views.includes(hash)){
      showView(hash);
      window.scrollTo({top: 0, behavior: 'instant'});
      return;
    }
    if (inViewAnchors[hash]){
      const view = inViewAnchors[hash];
      showView(view);
      setTimeout(() => {
        document.getElementById(hash)?.scrollIntoView({behavior: 'smooth', block: 'start'});
      }, 120);
      return;
    }
    showView('inicio');
  }
  window.addEventListener('hashchange', handleRoute);
  document.addEventListener('DOMContentLoaded', handleRoute);

  document.querySelectorAll('nav .links a').forEach(a => {
    a.addEventListener('click', () => {
      const target = a.getAttribute('href');
      if (target === window.location.hash){

      }
    });

  /* ---------- Render carpetas ---------- */
  function renderFolders(branchId, gridId){
    const grid = document.getElementById(gridId);
    if (!grid) return;
    const folders = categories.filter(c => c.branch === branchId);
    grid.innerHTML = folders.map(cat => `
      <button class="folder-card" data-cat="${cat.id}">
        <div class="folder-cover" style="background:${cat.cover};">${cat.icon}</div>
        <div class="folder-title">${cat.title}</div>
        <div class="folder-count">${cat.items.length} proyecto${cat.items.length === 1 ? '' : 's'}</div>
      </button>
    `).join('');
    grid.querySelectorAll('.folder-card').forEach(el => {
      el.addEventListener('click', () => openCategory(el.dataset.cat));
    });
  }
  renderFolders('audiovisual', 'grid-audiovisual');
  renderFolders('marketing', 'grid-marketing');
  renderFolders('diseno', 'grid-diseno');

  function updateBranchCounts(){
    ['audiovisual','marketing','diseno'].forEach(branch => {
      const count = categories.filter(c => c.branch === branch).length;
      const el = document.getElementById('count-' + branch);
      if (el) el.textContent = String(count).padStart(2, '0') + ' carpetas';
    });
  }
  updateBranchCounts();

  /* ---------- Modal ---------- */
  const overlay = document.getElementById('modal-overlay');
  const modalContent = document.getElementById('modal-content');
  let lastFocused = null;

  function openModal(){
    lastFocused = document.activeElement;
    overlay.classList.add('open');
    document.getElementById('modal-close').focus();
    document.body.style.overflow = 'hidden';
    document.addEventListener('keydown', onKeydown);
  }
  function closeModal(){
    overlay.classList.remove('open');
    modalContent.innerHTML = '';
    document.body.style.overflow = '';
    document.removeEventListener('keydown', onKeydown);
    if (lastFocused) lastFocused.focus();
  }
  function onKeydown(e){ if (e.key === 'Escape') closeModal(); }
  document.getElementById('modal-close').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

  function openCategory(categoryId){
    const category = categories.find(c => c.id === categoryId);
    let itemsHtml;
    if (category.items.length === 0){
      itemsHtml = `<div class="board-empty">Aún no hay proyectos en esta carpeta. Vuelve pronto ✦</div>`;
    } else {
      itemsHtml = `<div class="board-grid">` + category.items.map((item, i) => `
        <button class="board-item" data-index="${i}">
          <div class="board-item-cover" style="background:${item.cover};">${item.icon}</div>
          <div class="board-item-body">
            <div class="board-item-title">${item.title}</div>
            <span class="board-item-badge" style="background:${item.badgeColor};">${item.badge}</span>
          </div>
        </button>
      `).join('') + `</div>`;
    }
    modalContent.innerHTML = `
      <button class="modal-back" id="modal-back">← cerrar</button>
      <div class="modal-kicker">${category.icon} carpeta</div>
      <h3 class="modal-title">${category.title}</h3>
      ${itemsHtml}
    `;
    document.getElementById('modal-back').addEventListener('click', closeModal);
    modalContent.querySelectorAll('.board-item').forEach(el => {
      el.addEventListener('click', () => openItem(category, parseInt(el.dataset.index, 10)));
    });
    openModal();
  }

  function openItem(category, index){
    const item = category.items[index];
    let media;

    if (item.videoId){
      media = `<div class="detail-media detail-video-wrap">
        <iframe src="https://www.youtube.com/embed/${item.videoId}" title="${item.title}"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen></iframe>
      </div>`;
    } else if (item.spotifyShowId){
      media = `<div class="detail-media" style="border-radius:12px; overflow:hidden;">
        <iframe style="width:100%; display:block; border:0;"
          src="https://open.spotify.com/embed/show/${item.spotifyShowId}?utm_source=generator"
          height="352" frameBorder="0" allowfullscreen=""
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy" title="${item.title}"></iframe>
      </div>`;
    } else if (item.spotifyEpisodeId){
      media = `<div class="detail-media" style="border-radius:12px; overflow:hidden;">
        <iframe style="width:100%; display:block; border:0;"
          src="https://open.spotify.com/embed/episode/${item.spotifyEpisodeId}?utm_source=generator"
          height="152" frameBorder="0" allowfullscreen=""
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy" title="${item.title}"></iframe>
      </div>`;
    } else if (item.image){
      media = `<div class="detail-media"><img src="${item.image}" alt="${item.title}" style="width:100%; display:block;"></div>`;
    } else {
      media = `<div class="detail-media detail-cover-static" style="background:${item.cover};">${item.icon}</div>`;
    }

    modalContent.innerHTML = `
      <button class="modal-back" id="modal-back">← volver a ${category.title}</button>
      ${media}
      <span class="detail-badge" style="background:${item.badgeColor};">${item.badge}</span>
      <h3 class="modal-title" style="margin-top:6px;">${item.title}</h3>
      <p class="detail-desc">${item.description}</p>
      <p class="detail-role"><b>Mi rol:</b> ${item.role}</p>
      ${item.represents ? `<p class="detail-rep">${item.represents}</p>` : ''}
    `;
    document.getElementById('modal-back').addEventListener('click', () => openCategory(category.id));
  }
</script>
